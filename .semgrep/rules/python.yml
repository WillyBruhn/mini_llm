rules:
  - id: no-print
    languages: [python]
    severity: ERROR
    message: >-
      Do not use print(). Use the logging module instead:
      `logger = logging.getLogger(__name__)` and `logger.info(...)`.
    pattern: print(...)
    paths:
      exclude:
        - .venv

  - id: no-import-inside-function
    languages: [python]
    severity: ERROR
    message: >-
      Do not import inside a function or method. Put all imports at the top
      of the file.
    patterns:
      - pattern-either:
          - pattern: import $MODULE
          - pattern: from $MODULE import $NAME
      - pattern-inside: |
          def $FUNC(...):
            ...
    paths:
      exclude:
        - .venv

  - id: prefer-pathlib
    languages: [python]
    severity: ERROR
    message: >-
      Use pathlib.Path instead of os / os.path / glob for file paths
      (for example `Path(a) / b`, `.parent`, `.exists()`, `.mkdir(parents=True,
      exist_ok=True)`, `.iterdir()`, `.glob()`, `.resolve()`).
    pattern-either:
      - pattern: os.path.$FUNC(...)
      - pattern: os.makedirs(...)
      - pattern: os.mkdir(...)
      - pattern: os.listdir(...)
      - pattern: os.scandir(...)
      - pattern: os.walk(...)
      - pattern: os.remove(...)
      - pattern: os.unlink(...)
      - pattern: os.rmdir(...)
      - pattern: os.rename(...)
      - pattern: os.replace(...)
      - pattern: os.getcwd()
      - pattern: os.chdir(...)
      - pattern: glob.glob(...)
      - pattern: glob.iglob(...)
    paths:
      exclude:
        - .venv

  - id: no-relative-import
    languages: [python]
    severity: ERROR
    message: >-
      Do not use relative imports. Use the full package path instead
      (for example `from mini_llm.native import NativeGPT2`). This also
      applies to `import_module(".name", ...)`.
    pattern-either:
      - pattern-regex: '(?m)^[ \t]*from[ \t]+\.'
      - pattern-regex: 'import_module\(\s*["\x27]\.'
    paths:
      exclude:
        - .venv

  - id: no-import-star
    languages: [python]
    severity: ERROR
    message: >-
      Do not use `from module import *`. Import each name explicitly.
    pattern: from $MODULE import *
    paths:
      exclude:
        - .venv

  - id: no-sys-path-manipulation
    languages: [python]
    severity: ERROR
    message: >-
      Do not change sys.path. Install the package instead
      (`uv sync` installs `mini_llm` in editable mode) and import it by
      its full name.
    pattern-either:
      - pattern: sys.path.insert(...)
      - pattern: sys.path.append(...)
      - pattern: sys.path.extend(...)
      - pattern: sys.path.remove(...)
      - pattern: sys.path = $VALUE
      - pattern: sys.path += $VALUE
      - pattern: sys.path[...] = $VALUE
    paths:
      exclude:
        - .venv

  - id: no-private-import
    languages: [python]
    severity: ERROR
    message: >-
      Do not import private names or private modules (names that start with
      a single underscore). Use the public API instead, or remove the leading
      underscore if the name must be shared. Dunder names such as
      `__version__` are allowed.
    pattern-either:
      - patterns:
          - pattern: from $MODULE import $NAME
          - metavariable-regex:
              metavariable: $NAME
              regex: ^_(?!_)
      - pattern-regex: (?m)^[ \t]*from[ \t]+(\w+\.)*_(?!_)\w*(\.\w+)*[ \t]+import\b
    paths:
      exclude:
        - .venv

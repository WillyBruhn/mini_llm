rules:
  - id: no-print
    languages: [python]
    severity: ERROR
    message: >-
      Do not use print(). Use the logging module instead:
      `logger = logging.getLogger(__name__)` and `logger.info(...)`.
    pattern: print(...)
    paths:
      exclude:
        - .venv

  - id: no-import-inside-function
    languages: [python]
    severity: ERROR
    message: >-
      Do not import inside a function or method. Put all imports at the top
      of the file.
    patterns:
      - pattern-either:
          - pattern: import $MODULE
          - pattern: from $MODULE import $NAME
      - pattern-inside: |
          def $FUNC(...):
            ...
    paths:
      exclude:
        - .venv

  - id: prefer-pathlib
    languages: [python]
    severity: ERROR
    message: >-
      Use pathlib.Path instead of os / os.path / glob for file paths
      (for example `Path(a) / b`, `.parent`, `.exists()`, `.mkdir(parents=True,
      exist_ok=True)`, `.iterdir()`, `.glob()`, `.resolve()`).
    pattern-either:
      - pattern: os.path.$FUNC(...)
      - pattern: os.makedirs(...)
      - pattern: os.mkdir(...)
      - pattern: os.listdir(...)
      - pattern: os.scandir(...)
      - pattern: os.walk(...)
      - pattern: os.remove(...)
      - pattern: os.unlink(...)
      - pattern: os.rmdir(...)
      - pattern: os.rename(...)
      - pattern: os.replace(...)
      - pattern: os.getcwd()
      - pattern: os.chdir(...)
      - pattern: glob.glob(...)
      - pattern: glob.iglob(...)
    paths:
      exclude:
        - .venv

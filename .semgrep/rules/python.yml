rules:
  - id: no-print
    languages: [python]
    severity: ERROR
    message: >-
      Do not use print(). Use the logging module instead:
      `logger = logging.getLogger(__name__)` and `logger.info(...)`.
    pattern: print(...)
    paths:
      exclude:
        - .venv

  - id: no-import-inside-function
    languages: [python]
    severity: ERROR
    message: >-
      Do not import inside a function or method. Put all imports at the top
      of the file.
    patterns:
      - pattern-either:
          - pattern: import $MODULE
          - pattern: from $MODULE import $NAME
      - pattern-inside: |
          def $FUNC(...):
            ...
    paths:
      exclude:
        - .venv

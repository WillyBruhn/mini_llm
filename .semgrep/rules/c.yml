rules:
  - id: c-no-stdout
    languages: [regex]
    severity: ERROR
    message: >-
      Do not write to stdout from the engine library. The engine runs inside Python
      and a caller may use stdout. Use `fprintf(stderr, ...)` for diagnostics.
    # `\b` keeps fprintf and snprintf out. Comment lines are skipped.
    pattern-regex: (?m)^(?![ \t]*(//|\*|/\*)).*\b(printf|puts|putchar)\s*\(
    paths:
      include:
        - "*.c"
        - "*.cu"
        - "*.h"
        - "*.cpp"
      exclude:
        - /engine/tests
        - /engine/bench  # command-line programs print their results

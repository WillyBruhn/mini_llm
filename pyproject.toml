[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-llm-tools"
version = "0.1.0"
description = "Python tooling for the mini_llm inference engine"
requires-python = ">=3.12,<3.13"
dependencies = [
    "huggingface-hub>=0.34,<1.0",
    "numpy>=2.0,<3.0",
    "torch>=2.7,<3.0",
    "transformers>=4.50,<5.0",
]

[dependency-groups]
dev = [
    "mypy>=1.13,<2.0",
    "ninja>=1.11,<2.0",
    "pytest>=8.0,<9.0",
    "ruff>=0.8,<1.0",
    "semgrep>=1.100,<2.0",
]

[tool.uv]
# Install mini_llm in editable mode so it is imported by its full name.
package = true
default-groups = []

[tool.setuptools.packages.find]
where = ["pytorch/src"]

[tool.setuptools.package-data]
mini_llm = ["*.cpp"]

[tool.ruff]
src = ["pytorch/src", "scripts"]
extend-exclude = [".semgrep", "build", "models"]

[tool.ruff.lint]
# Defaults (E4, E7, E9, F), isort import sorting, and ANN (type annotations
# are required on every function argument and return value).
select = ["E4", "E7", "E9", "F", "I", "ANN"]

[tool.ruff.lint.isort]
known-first-party = ["mini_llm"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["pytorch", "scripts"]
exclude = ["^build/", "^models/", "^\\.semgrep/", "^\\.venv/"]
# A `# type: ignore` must name the error code it silences.
enable_error_code = ["ignore-without-code"]
